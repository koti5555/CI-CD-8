name: Practical 8 - Publish Student Result Image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/student-result-prediction

jobs:
  test-build-publish-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated tests
        run: python -m unittest discover -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tested image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:v1
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Student Result Prediction model serving application
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Pull the published image by commit tag
        run: docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run container from GHCR image
        run: |
          docker run -d --name student-result-from-ghcr \
            -p 5000:5000 ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify health endpoint
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "GHCR container health check passed."
              exit 0
            fi
            sleep 2
          done
          docker logs student-result-from-ghcr
          exit 1

      - name: Verify PASS prediction
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)
          echo "PASS test response: $response"
          echo "$response" | grep -q '"prediction":"PASS"'

      - name: Verify FAIL prediction
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST -H "Content-Type: application/json" \
            -d '{"attendance":55,"internal_marks":30,"assignment_marks":40,"previous_score":35}' \
            http://localhost:5000/predict)
          echo "FAIL test response: $response"
          echo "$response" | grep -q '"prediction":"FAIL"'

      - name: Show container logs
        if: always()
        run: docker logs student-result-from-ghcr || true

      - name: Stop and remove verification container
        if: always()
        run: docker rm -f student-result-from-ghcr || true
